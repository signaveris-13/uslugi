# Прод на одном VPS. Запуск: docker compose -f deploy/compose.yml --env-file deploy/.env up -d --build
# Настройки — в deploy/.env (образец: deploy/env.example). Postgres наружу не открыт.

x-app: &app
  build:
    context: ..
  image: uslugi:latest
  restart: unless-stopped
  environment:
    # staging — тестовый стенд (бейдж «Stage» в админке и приложении), production — прод.
    APP_ENV: ${APP_ENV:-production}
    DATABASE_URL: postgres://uslugi:${POSTGRES_PASSWORD}@postgres:5432/uslugi?sslmode=disable
    BOT_TOKEN: ${BOT_TOKEN}
    BOT_USERNAME: ${BOT_USERNAME:-}
    TEAM_TELEGRAM_IDS: ${TEAM_TELEGRAM_IDS}
    ADMIN_TIMEZONE: ${ADMIN_TIMEZONE:-Asia/Ho_Chi_Minh}
    HTTP_ADDR: ":8080"
    # Mini App открывается по https; фото из него лежат в общем томе web и bot.
    PUBLIC_URL: https://${DOMAIN}
    MEDIA_DIR: /data/media
    # Куда пересылать обращения в поддержку: @username (нажал /start в боте), @канал или chat ID.
    SUPPORT_CHAT: ${SUPPORT_CHAT:-}
  volumes:
    - media:/data/media
  depends_on:
    migrate:
      condition: service_completed_successfully
    media-init:
      condition: service_completed_successfully

services:
  # Том с фото должен принадлежать пользователю app (uid 10001) из образа.
  # Если том первым создал другой контейнер (backup), он принадлежит root, и загрузка
  # фото падает с «permission denied». Поэтому владельца выставляем при каждом запуске.
  media-init:
    image: alpine:3.20
    restart: "no"
    volumes:
      - media:/data/media
    command: ["chown", "-R", "10001:10001", "/data/media"]

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: uslugi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: uslugi
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uslugi -d uslugi"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Применяет миграции при каждом запуске и завершается; остальные ждут его.
  migrate:
    <<: *app
    restart: "no"
    command: ["migrate", "up"]
    depends_on:
      postgres:
        condition: service_healthy

  bot:
    <<: *app
    command: ["bot"]

  web:
    <<: *app
    command: ["web"]

  worker:
    <<: *app
    command: ["worker"]

  # HTTPS: Caddy сам выпускает и продлевает сертификат Let's Encrypt для DOMAIN.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      # Секрет в пути к сводке для адвайзера; без него путь не откроется.
      STATUS_TOKEN: ${STATUS_TOKEN:?STATUS_TOKEN не задан, запусти bash deploy/update.sh}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./status:/srv/status:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

  # Ежедневный дамп базы в deploy/backups на сервере, хранится 30 дней (§12).
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
      - media:/media:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        while true; do
          pg_dump -h postgres -U uslugi uslugi | gzip > /backups/uslugi-$$(date +%F).sql.gz
          tar -czf /backups/media-$$(date +%F).tar.gz -C /media .
          find /backups -name 'uslugi-*.sql.gz' -mtime +30 -delete
          find /backups -name 'media-*.tar.gz' -mtime +7 -delete
          sleep 86400
        done
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  media:
  caddy_data:
  caddy_config:

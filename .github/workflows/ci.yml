name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: uslugi
          POSTGRES_PASSWORD: uslugi
          POSTGRES_DB: uslugi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U uslugi -d uslugi"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    env:
      DATABASE_URL: postgres://uslugi:uslugi@localhost:5432/uslugi?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: go.mod и go.sum в порядке
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Шаблоны templ сгенерированы
        run: |
          make generate
          git diff --exit-code -- '*_templ.go'

      - name: Сборка
        run: go build ./...

      - name: Анализ
        run: go vet ./...

      - name: Миграции применяются и откатываются
        run: |
          go run ./cmd/migrate up
          go run ./cmd/migrate down
          go run ./cmd/migrate up

      - name: Тесты (на Postgres)
        run: go test ./...

  # Прод-образ собирается, и стек из deploy/compose.yml поднимается и отвечает.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Настройки для проверки
        run: |
          cat > deploy/.env <<EOF
          DOMAIN=localhost
          POSTGRES_PASSWORD=ci_$(openssl rand -hex 12)
          BOT_TOKEN=
          TEAM_TELEGRAM_IDS=1
          EOF

      - name: Compose-файл валиден
        run: docker compose -f deploy/compose.yml --env-file deploy/.env config -q

      - name: Сборка образа и запуск базы, миграций и админки
        run: docker compose -f deploy/compose.yml --env-file deploy/.env up -d --build --wait postgres web

      - name: Миграции прошли, админка отвечает
        run: |
          docker compose -f deploy/compose.yml --env-file deploy/.env logs migrate | tail -3
          for i in $(seq 1 20); do
            if docker compose -f deploy/compose.yml --env-file deploy/.env exec -T web wget -qO- localhost:8080/healthz; then echo; exit 0; fi
            sleep 1
          done
          docker compose -f deploy/compose.yml --env-file deploy/.env logs web
          exit 1

      - name: Остановить
        if: always()
        run: docker compose -f deploy/compose.yml --env-file deploy/.env down -v
